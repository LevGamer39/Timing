[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
# Импорты в боте плоские (core.*, routers.*), поэтому корень пакета — bot/.
# Без этого `pytest` (не `python -m pytest`) не находит core.
pythonpath = .
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
