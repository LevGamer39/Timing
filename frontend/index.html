<script>
// Тема до первой отрисовки и до загрузки модулей/шаблонов.
(() => {
  let saved;
  try { saved = JSON.parse(localStorage.getItem('timing-demo-v1') || '{}'); } catch {}
  const theme = saved?.theme;
  document.documentElement.dataset.theme = theme === 'light' || theme === 'dark' ? theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.accent = saved?.accent || 'orange';
})();
</script>
