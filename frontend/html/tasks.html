<!-- fragment:screen -->
{{0}}
<div class="stack" style="margin-top: 8px">
  <div class="row" style="flex-wrap: wrap; gap: 8px">
    <h1 class="title-l grow">Мои задачи</h1>
    <button class="btn sm" type="button" id="task-add">{{1}}Задача</button>
  </div>
  <p class="hint" style="margin: 0">Личные задачи и задания учителя. Отметка «готово» сразу видна в дневнике.</p>
  <div id="task-list" class="stack-sm"><div class="card pad"><p class="muted" style="margin: 0">Загружаю…</p></div></div>
</div>
<!-- /fragment:screen -->

<!-- fragment:form -->
<h2 class="h2" style="font-size: 20px">{{0}}</h2>
<form class="stack" id="task-f" novalidate style="margin-top: 12px">
  <label class="label" for="tf-title">Что сделать</label>
  <input class="input" id="tf-title" maxlength="200" placeholder="Например, параграф 12">
  <label class="label" for="tf-subject">Предмет</label>
  <input class="input" id="tf-subject" maxlength="100" placeholder="Например, алгебра">
  <label class="label" for="tf-deadline">Срок</label>
  <input class="input" id="tf-deadline" type="datetime-local">
  <label class="label" for="tf-priority">Важность</label>
  <select class="input" id="tf-priority"><option value="low">Низкая</option><option value="medium" selected>Обычная</option><option value="high">Высокая</option></select>
  <label class="label" for="tf-desc">Заметка</label>
  <textarea class="input" id="tf-desc" rows="3" maxlength="2000" style="resize: vertical"></textarea>
  <p class="error" id="tf-err" role="alert" hidden></p>
  <div class="row" style="justify-content: flex-end; gap: 8px"><button class="btn ghost sm" type="button" data-close>Отмена</button><button class="btn sm" type="submit">{{1}}</button></div>
</form>
<!-- /fragment:form -->

<!-- fragment:sub -->
<label class="row" style="gap: 10px; min-height: 40px; padding: 6px 0">
  <input type="checkbox" data-subdone="{{0}}" {{1}}>
  <span class="grow" style="{{2}}">{{3}}</span>
</label>
<!-- /fragment:sub -->
