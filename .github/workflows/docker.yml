name: Docker images to GHCR

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# GHCR требует lowercase в имени репозитория, а GitHub хранит его как есть
# (LevGamer39/Timing) — приводим owner/repo к нижнему регистру в шаге lower.

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: lower
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.lower.outputs.repo }}/backend:latest
            ghcr.io/${{ steps.lower.outputs.repo }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: lower
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - uses: docker/build-push-action@v6
        with:
          context: ./bot
          file: ./bot/dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # Модель Whisper в образ не кладём: голос по умолчанию выключен,
          # образ остаётся лёгким и быстрым в сборке.
          build-args: |
            PRELOAD_WHISPER=false
          tags: |
            ghcr.io/${{ steps.lower.outputs.repo }}/bot:latest
            ghcr.io/${{ steps.lower.outputs.repo }}/bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: lower
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.lower.outputs.repo }}/nginx:latest
            ghcr.io/${{ steps.lower.outputs.repo }}/nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ollama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: lower
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - uses: docker/build-push-action@v6
        with:
          context: ./ollama
          push: true
          # Модель на arm64 через QEMU качается медленно, но образ мультиарх нужен.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.lower.outputs.repo }}/ollama:latest
            ghcr.io/${{ steps.lower.outputs.repo }}/ollama:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
