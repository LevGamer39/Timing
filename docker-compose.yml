services:
  backend:
    build: ./backend
    image: ghcr.io/levgamer39/vectorvk/backend:latest
    container_name: timing_backend
    restart: unless-stopped
    volumes:
      - ./frontend:/frontend:ro
      - ./backend-data:/app/data
    env_file:
      - .env
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_HOST: timing_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-timingdb}
    depends_on:
      ollama:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - timing_net

  ollama:
    image: ollama/ollama:latest
    container_name: timing_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    networks:
      - timing_net

  # Одноразовая задача: тянет модель при первом запуске, чтобы не искать её
  # руками. Выключается флагом OLLAMA_AUTO_PULL - по умолчанию модель не
  # качается, потому что это ~4.7 ГБ и лишний минуты ожидания при каждом
  # `docker compose up` на чистой машине. С выключенным флагом задача
  # завершается мгновенно и ни на что не влияет.
  ollama-init:
    image: ollama/ollama:latest
    container_name: timing_ollama_init
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_AUTO_PULL: ${OLLAMA_AUTO_PULL:-false}
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c '
        if [ "$$OLLAMA_AUTO_PULL" != "true" ]; then
          echo "[ollama-init] OLLAMA_AUTO_PULL=$$OLLAMA_AUTO_PULL - пропускаю загрузку модели";
          exit 0;
        fi;
        until ollama list >/dev/null 2>&1; do
          echo "[ollama-init] жду готовности ollama";
          sleep 2;
        done;
        if ollama list | grep -q "$$OLLAMA_MODEL"; then
          echo "[ollama-init] модель $$OLLAMA_MODEL уже загружена";
          exit 0;
        fi;
        echo "[ollama-init] загружаю $$OLLAMA_MODEL, это надолго";
        ollama pull "$$OLLAMA_MODEL" && echo "[ollama-init] готово" || {
          echo "[ollama-init] не удалось загрузить модель" >&2;
          exit 1;
        }'
    depends_on:
      - ollama
    networks:
      - timing_net

  nginx:
    build: ./nginx
    image: ghcr.io/levgamer39/vectorvk/nginx:latest
    container_name: timing_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set}
      MAILPIT_PANEL_PASSWORD: ${MAILPIT_PANEL_PASSWORD:-demo2024}
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - backend
    networks:
      - timing_net

  certbot:
    image: certbot/certbot
    container_name: timing_certbot
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set}
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h;
             done"
    networks:
      - timing_net

  bot:
    build:
      context: ./bot
      dockerfile: dockerfile
      args:
        # Модель скачивается только при VOICE_ENABLED=true.
        PRELOAD_WHISPER: ${VOICE_ENABLED:-false}
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    image: ghcr.io/levgamer39/vectorvk/bot:latest
    container_name: timing_bot
    restart: unless-stopped
    depends_on:
      - backend
      - ollama
    env_file:
      - .env
    environment:
      - MAX_BOT_URL=http://backend:8000
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./bot/data:/app/data
    networks:
      - timing_net

  # Локальный перехватчик писем для разработки: принимает всё, ничего не
  # отправляет наружу. Запуск: docker compose --profile mailpit up -d mailpit
  # Письма видны на http://localhost:8025 и через сайт — https://timing.myftp.org/mailpit/
  # (nginx, за basic-auth: логин timing, пароль — MAILPIT_PANEL_PASSWORD).
  # SMTP — localhost:1025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: timing_mailpit
    restart: unless-stopped
    profiles: ["mailpit"]
    command: ["--webroot=/mailpit/"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - timing_net

  db:
    image: postgres:latest
    container_name: timing_db
    env_file: ".env"
    # Только loopback: снаружи БД недоступна, но локальные тесты и psql
    # могут подключиться к localhost:5432.
    ports:
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_DB: ${DB_NAME:-timingdb}
      POSTGRES_LOG_FILE: /var/log/postgres.log
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASS:?db password must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-timingdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - timing_net
    volumes:
      - ./pg_data:/var/lib/postgresql

volumes:
  ollama_data:

networks:
  timing_net:
    driver: bridge
