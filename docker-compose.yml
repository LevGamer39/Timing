services:
  backend:
    build: ./backend
    container_name: vector_backend
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
      - ./frontend:/frontend:ro
    env_file:
      - .env
    expose:
      - "8000"
    environment:
      DB_HOST: vector_db
      DB_PORT: 5432
      DB_NAME: vectordb
    depends_on:
      ollama:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - vector_net

  ollama:
    image: ollama/ollama:latest
    container_name: vector_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    networks:
      - vector_net

  nginx:
    image: nginx:alpine
    container_name: vector_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - vector_net

  certbot:
    image: certbot/certbot
    container_name: vector_certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h;
             done"

  db:
    image: postgres:latest
    command: ["postgres", "-c", "log_statement=all", "-c", "log_destination=stderr"]
    container_name: vector_db
    env_file: ".env"
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: vectordb
      POSTGRES_LOG_FILE: /var/log/postgres.log
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASS:?db password must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d vectordb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vector_net
    volumes:
      - ./pg_data:/var/lib/postgresql
    

volumes:
  ollama_data:
  postgresql_data:

networks:
  vector_net:
    driver: bridge
